[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture2pdf"
version = "0.2.0"
description = "Extract unique, reconstructed lecture slides into searchable study PDFs"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "opencv-python-headless>=4.8", "Pillow>=10", "reportlab>=4", "scikit-image>=0.22", "pytesseract>=0.3.10"]

[project.optional-dependencies]
test = ["pytest>=8"]
paddle = ["paddleocr>=2.8"]
gpu = ["torch>=2.2"]

[project.scripts]
lecture2pdf = "lecture2pdf.cli:main"

[tool.setuptools.packages.find]
include = ["lecture2pdf*"]
